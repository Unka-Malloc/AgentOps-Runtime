[package]
name = "aor-decision"
description = "AgentOps-Runtime gate: Decision-Memo."
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Unka-Malloc/AgentOps-Runtime"
readme = "../../README.md"
keywords = ["aor", "agentops", "gate", "decision"]

[lib]
name = "aor_decision"
path = "src/lib.rs"

[dependencies]
aor = { path = "../..", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
