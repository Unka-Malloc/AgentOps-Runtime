[package]
name = "aor-resource"
description = "AgentOps-Runtime gate: Resource-Registry."
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/Unka-Malloc/AgentOps-Runtime"
readme = "../../README.md"
keywords = ["aor", "agentops", "gate", "resource"]

[lib]
name = "aor_resource"
path = "src/lib.rs"

[dependencies]
aor = { path = "../..", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
