[package]
name = "aor"
description = "AgentOps-Runtime core contracts: gate descriptor, enforcement profiles, events, findings, evidence records, store traits and threshold primitives. Gates are one crate each under crates/; this crate holds only gate-neutral machinery."
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Unka-Malloc/AgentOps-Runtime"
readme = "README.md"
keywords = ["agent", "gate", "runtime", "observability"]
categories = ["development-tools"]

[lib]
name = "aor"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace]
members = ["crates/*"]
resolver = "2"
